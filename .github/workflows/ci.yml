name: Edict CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check edict/ tests/ --select E,F,W --ignore E501

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r edict/backend/requirements.txt
          pip install pyright
      - name: Type check
        run: pyright edict/backend/app/ --level basic
        continue-on-error: true  # Start with warnings, tighten later

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r edict/backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run unit & integration tests
        run: |
          python -m pytest tests/ -v --tb=short -x \
            --ignore=tests/test_server.py \
            --ignore=tests/test_kanban.py \
            --ignore=tests/test_file_lock.py \
            --ignore=tests/test_e2e_kanban.py
        env:
          PYTHONPATH: .

  migration-check:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r edict/backend/requirements.txt
      - name: Check for pending migrations
        run: echo "Migration check placeholder — implement with alembic check when DB is available"
        continue-on-error: true
