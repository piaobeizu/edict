name: Edict CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check . tests/ --select E,F,W --ignore E501

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ./kernel
          pip install pyright
      - name: Kernel import smoke test
        run: python -c "import kernel; from kernel import WorkflowEngine; from kernel.adapters.edict_routing import create_edict_state_machine"
      - name: Type check
        run: pyright backend/app/ kernel/src/ tests/ kernel/tests/ --level basic
        continue-on-error: true  # Start with warnings, tighten later

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ./kernel
          pip install pytest pytest-cov pytest-asyncio
      - name: Kernel import smoke test
        run: python -c "import kernel; from kernel import WorkflowEngine; from kernel.adapters.edict_routing import create_edict_state_machine"
      - name: Run unit & integration tests
        run: |
          python -m pytest tests/ kernel/tests/ -v --tb=short -x
        env:
          PYTHONPATH: .

  migration-check:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ./kernel
      - name: Check for pending migrations
        run: echo "Migration check placeholder — implement with alembic check when DB is available"
        continue-on-error: true
