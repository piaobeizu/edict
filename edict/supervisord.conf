; ══════════════════════════════════════════════════════
; 三省六部 · Supervisor 进程管理配置 (v1)
; ══════════════════════════════════════════════════════
;
; 在单一容器内管理 3 个进程：
;   1. OpenClaw Gateway  — AI Agent 运行时网关 (port 18789)
;   2. Dashboard Server  — 看板 API + 前端 (port 7891)
;   3. Data Refresh Loop — 数据同步循环
;
; ══════════════════════════════════════════════════════

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

; ── OpenClaw Gateway ──
; 监听 0.0.0.0:18789，供 dashboard 的 openclaw agent 命令使用
[program:openclaw-gateway]
command=node /openclaw/openclaw.mjs gateway --allow-unconfigured --auth none
directory=/openclaw
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/var/log/supervisor/openclaw-gateway.log
stderr_logfile=/var/log/supervisor/openclaw-gateway-err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production"

; ── Dashboard Server (Python) ──
; 看板 API + React 前端，监听 0.0.0.0:7891
; server.py 使用纯 Python 标准库，无需 pip install
[program:dashboard]
command=python3 dashboard/server.py --host 0.0.0.0 --port 7891
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/var/log/supervisor/dashboard.log
stderr_logfile=/var/log/supervisor/dashboard-err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── Data Refresh Loop ──
; 定时同步 openclaw 运行时数据 → data/ JSON 文件
; 依赖 gateway 启动后运行
[program:data-refresh]
command=bash scripts/run_loop.sh 15
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=1
stdout_logfile=/var/log/supervisor/data-refresh.log
stderr_logfile=/var/log/supervisor/data-refresh-err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── 进程组 ──
[group:edict-all]
programs=openclaw-gateway,dashboard,data-refresh
priority=999
