server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS，30s TTL 防止缓存过期 IP
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 禁止缓存 HTML 和 Flutter bootstrap 文件（确保每次拿到最新版）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Flutter Web SPA — 所有路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 代理到后端
    location /api/ {
        set $backend_upstream http://backend:8001;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket 代理
    location /ws {
        set $backend_upstream http://backend:8001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # CanvasKit WASM 文件可以长缓存（文件名带 hash）
    location /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # assets 目录（字体等，带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
